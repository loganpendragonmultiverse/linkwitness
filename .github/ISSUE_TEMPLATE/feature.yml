name: Feature request
description: Propose a focused improvement within the project's intended scope
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete difficulty would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: impact
    attributes:
      label: Scope and compatibility
      description: Note new dependencies, format changes, platform impact, or compatibility concerns
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing Issues and Discussions for this proposal.
          required: true
        - label: This request fits the project's stated purpose rather than turning it into a broader platform.
          required: true
